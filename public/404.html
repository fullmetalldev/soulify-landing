<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="robots" content="noindex"/>
    <title>Page not found – Soulify</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Served by Vercel for any unknown address. Self-contained: same design tokens as src/styles/landing.css -->
    <style>
        :root {
            --blue: #155dfc;
            --purple: #9810fa;
            --gradient: linear-gradient(to right, var(--blue), var(--purple));
            --bg: #F6F7FB;
            --border: #E9EAF0;
            --text: #111827;
            --text-muted: #6B7280;
            --text-faint: #9CA3AF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
            padding: 32px 16px;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            background: radial-gradient(50% 40% at 80% 15%, #9810fa14, transparent 70%),
            radial-gradient(45% 40% at 15% 85%, #155dfc12, transparent 70%),
            var(--bg);
        }

        a {
            text-decoration: none;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 19px;
            font-weight: 700;
            color: var(--text);
        }

        .logo span {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 11px;
            background: var(--gradient);
            color: #fff;
        }

        .card {
            width: min(460px, 100%);
            padding: 36px 32px 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 10px;
            border-radius: 24px;
            background: #fff;
            border: 1px solid var(--border);
            box-shadow: 0 12px 24px -8px #10182826;
            animation: popIn 0.3s ease-out;
        }

        .chat {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 14px;
            padding: 16px;
            border-radius: 18px;
            background: var(--bg);
            font-size: 14px;
        }

        .bubble {
            align-self: flex-end;
            padding: 8px 14px;
            border-radius: 16px 16px 6px 16px;
            background: var(--gradient);
            color: #fff;
        }

        .bubble--reply {
            align-self: flex-start;
            border-radius: 16px 16px 16px 6px;
            background: #fff;
            border: 1px solid var(--border);
            color: var(--text-faint);
            letter-spacing: 2px;
        }

        .code {
            font-size: 64px;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.04em;
            background: var(--gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        p {
            max-width: 340px;
            font-size: 16px;
            line-height: 1.5;
            color: var(--text-muted);
        }

        .buttons {
            width: 100%;
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }

        .btn {
            flex: 1;
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: #fff;
            color: var(--text);
            font-size: 15px;
            font-weight: 600;
            transition: transform 0.2s, border-color 0.2s, color 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-1px);
            border-color: var(--blue);
            color: var(--blue);
        }

        .btn--primary {
            border-color: transparent;
            background: var(--gradient);
            color: #fff;
            box-shadow: 0 6px 16px -6px #155dfc80;
        }

        .btn--primary:hover {
            border-color: transparent;
            color: #fff;
            box-shadow: 0 10px 22px -8px #155dfc99;
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: translateY(12px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }

        @media (max-width: 480px) {
            .card {
                padding: 28px 20px 22px;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
<a href="/" class="logo">
    <span aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round"><path
                d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path
                d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/></svg>
    </span>
    Soulify
</a>

<main class="card">
    <div class="chat" aria-hidden="true">
        <span class="bubble">Hey, are you there?</span>
        <span class="bubble bubble--reply">…</span>
    </div>

    <span class="code">404</span>
    <h1>This page doesn't exist</h1>
    <p>The link may be old or mistyped. Let's get you back to somewhere that talks back.</p>

    <div class="buttons">
        <a class="btn" href="/">Back to home</a>
        <a class="btn btn--primary" href="https://app.soulify.chat">Open the app</a>
    </div>
</main>
</body>
</html>
